name: Refresh npm lockfile

on:
  push:
    branches:
      - feature/mgb-plan-format-v1
    paths:
      - package.json
      - .github/workflows/refresh-npm-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mgb-plan-format-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies\n        run: npm ci\n      - name: TypeScript validation\n        run: npm run typecheck\n      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh npm lockfile"
            git pull --rebase origin feature/mgb-plan-format-v1
            git push
          fi
